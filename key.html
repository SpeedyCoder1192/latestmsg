<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access Required</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: sans-serif;
      transition: background 0.3s;
    }

    body.dark-mode {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode .container {
      background: #2d2d2d;
      color: #ffffff;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      margin-bottom: 30px;
      color: #666;
    }

    body.dark-mode p {
      color: #aaa;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      transition: border 0.3s;
    }

    body.dark-mode input {
      background: #3d3d3d;
      color: #ffffff;
      border-color: #555;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #764ba2;
    }

    .error {
      color: #e74c3c;
      margin-top: 15px;
      display: none;
    }

    body.dark-mode .error {
      color: #ff6b6b;
    }

    .toggle-dark {
      margin-top: 20px;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Access Required</h1>
    <p>Enter the passcode to continue</p>
    <input type="password" id="passcode" placeholder="Enter passcode" />
    <button onclick="checkPasscode()">Unlock</button>
    <div class="error" id="error">❌ Incorrect passcode</div>
    <div class="toggle-dark" onclick="toggleDarkMode()">🌙</div>
  </div>

  <script>
    const PASSCODE = "SFCisCookin";

    function checkPasscode() {
      const input = document.getElementById('passcode').value;
      if (input === PASSCODE) {
        sessionStorage.setItem('unlocked', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('passcode').value = '';
      }
    }

    document.getElementById('passcode').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPasscode();
    });

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    // Load dark mode preference
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }
  </script>
</body>
</html>
