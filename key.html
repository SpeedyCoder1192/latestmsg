<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access Required</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: sans-serif;
    }

    .container {
      background: #121212;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
      color: #e0e0e0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
      color: #ffffff;
    }

    p {
      margin-bottom: 30px;
      color: #b0bec5;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #333;
      border-radius: 5px;
      font-size: 16px;
      background: #1e1e1e;
      color: #e0e0e0;
    }

    input:focus {
      outline: none;
      border-color: #64b5f6;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #764ba2;
    }

    .error {
      color: #ff6b6b;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Access Required</h1>
    <p>Enter the passcode to continue</p>
    <input type="password" id="passcode" placeholder="Enter passcode" />
    <button onclick="checkPasscode()">Unlock</button>
    <div class="error" id="error">❌ Incorrect passcode</div>
  </div>

  <script>
    const PASSCODE = "SFCisCookin";

    function checkPasscode() {
      const input = document.getElementById('passcode').value;
      if (input === PASSCODE) {
        sessionStorage.setItem('unlocked', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('passcode').value = '';
      }
    }

    document.getElementById('passcode').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPasscode();
    });
  </script>
</body>
</html>
